<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Личный кабинет — Дымская</title><link rel="stylesheet" href="style.css"><script src="js/header.js" defer></script><script src="js/footer.js" defer></script><script src="js/script.js" defer></script><script src="js/account.js" defer></script></head><body class="account-page"><div data-header></div><main>
<h1 class="section-title account-title">Личный кабинет</h1>
<section class="container account-profile"><div class="profile-avatar"><svg viewBox="0 0 160 160" role="img" aria-label="Аватар пользователя"><rect width="160" height="160" rx="18" fill="#f5f2ec"/><circle cx="80" cy="58" r="31" fill="#202022"/><path d="M18 142c0-48 124-48 124 0Z" fill="#202022"/></svg><button class="button" type="button" id="edit-profile">Редактировать</button></div><form id="profile-form" class="profile-fields"><label>Имя<input name="name" autocomplete="name" required maxlength="100" readonly></label><label>Email<input name="email" type="email" autocomplete="email" required readonly></label><label>Телефон<input name="phone" type="tel" autocomplete="tel" maxlength="40" readonly></label><label>Пароль<input type="password" value="demo-password" disabled aria-label="Пароль недоступен в демонстрационной версии"></label><button class="button" id="save-profile" hidden>Сохранить</button><p id="profile-status" role="status"></p></form></section>
<section><h2 class="section-title">Адреса</h2><div class="container account-columns account-space"><div><h3>Самовывоз</h3><label class="account-check"><input type="radio" name="pickup" value="moscow">г. Москва, ул. Садовая-Каретная, д. 8</label><label class="account-check"><input type="radio" name="pickup" value="tula">г. Тула, ул. Политическая, д. 12</label></div><div><h3>Доставка</h3><div id="delivery-addresses"></div><div class="account-actions"><button class="button" id="edit-address">Редактировать</button><button class="button button-outline" id="add-address">Добавить адрес</button></div></div></div></section>
<section><h2 class="section-title">Мои заказы</h2><div class="account-orders" id="account-orders"></div></section>
<section class="account-section"><h2 class="section-title">Избранное</h2><div class="container account-favorites" id="account-favorites"></div></section>
<section class="account-section"><h2 class="section-title">Настройки</h2><div class="container account-space"><div class="account-columns"><div><h3>Уведомления</h3><label class="account-check"><input type="checkbox" data-setting="email">Email — письма о новых заказах, акциях и статусах доставки.</label><label class="account-check"><input type="checkbox" data-setting="sms">СМС — уведомления о подтверждении заказа и времени доставки.</label><label class="account-check"><input type="checkbox" data-setting="push">Push — быстрые уведомления в браузере или приложении.</label></div><div><h3>Привязка карт для оплаты</h3><p class="account-card-example">✓ &nbsp; **** 1234 (Visa) &nbsp; · &nbsp; пример из макета</p><div class="account-actions"><button class="button" data-payment-demo>Редактировать</button><button class="button button-outline" data-payment-demo>Добавить новую карту</button></div></div></div><div class="account-session-actions"><button class="button" id="account-logout">Выйти из аккаунта</button><button class="button button-outline" id="account-delete">Удалить аккаунт</button></div></div></section>
</main><div data-footer></div></body></html>
